name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for npm provenance attestation

jobs:
  publish:
    name: Publish @cisco_open/mcpmock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never cache in release builds

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Stamp version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v1.0.0-rc.2 or v1.0.0
          VERSION="${TAG#v}"                 # strip leading 'v'
          npm version "$VERSION" --no-git-tag-version

      - name: Publish
        run: |
          TAG="${GITHUB_REF_NAME#v}"         # e.g. 1.0.0-rc.2 or 1.0.0
          if [[ "$TAG" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
          # OIDC handles auth; provenance is automatic
